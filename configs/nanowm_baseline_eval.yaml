# Headline a vs a+aug eval at the fps-2 control rate (eval/eval_baseline.py, run_eval_suite.sh).
# eval_baseline.py drives gym_pusht at 2 Hz by holding each action for frame_interval sim steps;
# lerobot-eval's native 10 Hz would under-actuate an fps-2 policy 5x.
extends: nanowm_pusht_common.yaml

ckpt_a: outputs/train/nanowm_aug/baseline_a_obs2_s100000/checkpoints/last/pretrained_model
ckpt_b: outputs/train/nanowm_aug/aug_obs2_r1500_s100000/checkpoints/last/pretrained_model
val_inits: ~/Downloads/bmw48-osfstorage-datasets-archive/pusht_noise/val/states.pth
rollouts_per_init: 5           # 21 held-out val inits x 5
random_inits: 100
seed: 0                        # eval_baseline pairs arms by (init, rollout) via its own seeding
max_ticks: 60                  # 2 Hz ticks == 300 sim steps == pusht.episode_length
videos_per_config: 12
out: outputs/eval/nanowm_aug
