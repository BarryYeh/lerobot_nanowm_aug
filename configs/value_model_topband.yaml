# Value (V) / reward-model (RM) training on NanoWM SD-VAE latents, top-wall band.
# Plan: value-model-opus5-5-sonnet5-floofy-engelbart.md. Sonnet implements + smokes each step;
# Opus reviews before any full run. Do not change label rules / splits / gate thresholds here --
# report back instead if one looks wrong.
extends: nanowm_pusht_common.yaml

out_dir: outputs/value_model/topband
ckpt_key: base   # cfg["ckpt"][ckpt_key] -- the base policy, never touched by NanoWM augmentation

label: {B: 200, na: 10, wall_pen_px: 10.0}
stack: {H: 3, fi: 5}

stage1:
  band: {n: 1500, seed: 700000, min_wall_gap: 45.0}
  reset: {n: 500, seed: 710000}
  episode_steps: 310
  query_every: 10
  perturb: {sigmas: [0.0, 0.5, 1.0], probs: [0.4, 0.3, 0.3], max_z: 3.0, noise_hold: 5, seed: 0}
  batch: 50
  shard_episodes: 100

stage2:
  anchors: {n: 250, seed: 720000, min_wall_gap: 45.0}
  k: 4
  h_max: 8
  inject_sigma: [0.0, 0.5]
  query_rounds: [0, 2, 4, 6, 8]

encode: {batch: 64, seed: 0}

model: {conv: [32, 64, 64], feat: 128, hidden: 256, ensemble: 5, bootstrap: true}

train: {lr: 3.0e-4, wd: 1.0e-4, batch: 256, max_epochs: 40, patience: 5, mix_stage1: 0.5,
        w_reward: 1.0, w_pose: 0.5, val_frac: 0.2, split_seed: 0}

gate: {auroc_s1_min: 0.75, ece_max: 0.05, auroc_s2_min: 0.70, within_anchor_auroc_min: 0.65,
       rm_mae_s1_max: 0.05, rm_mae_s2_max: 0.08}

smoke: {stage1_episodes: 20, stage2_anchors: 4, stage2_k: 2}
