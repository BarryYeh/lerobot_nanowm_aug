# Closed-loop imagined rollout generation (eval/closed_loop_rollout.py + imagined_rollout.py).
# Shared values come from nanowm_pusht_common.yaml; only what this experiment chooses is below.
extends: nanowm_pusht_common.yaml

ckpt_key: base                 # which ckpt.* entry to roll out
n_seeds: 250                   # seeds per invocation; run_dose500.sh splits 1000 over 4 parts
k: 4                           # branches per seed, round 0 only (afterwards each branch re-plans)
accept_mode: pair              # pair | terminal
accept_cov: 0.95
work: examples/nanowm_pusht_aug/cl/work_cl
out: examples/nanowm_pusht_aug/cl/accepted
