# E1 -- how many of the base policy's sampling modes escape a top-wall-band start?
# (eval/proto_mode_probe.py)
extends: nanowm_pusht_common.yaml

ckpt_key: base
seed: 400000                   # seed_namespace.mode_probe
n_starts: 4
k_modes: 20                    # distinct action samples drawn per start
rollouts_per_mode: 1
exec_steps: 10
min_wall_gap: 0.0
out: examples/nanowm_pusht_aug/cl/e1_modes
video: true
video_max_starts: 4
