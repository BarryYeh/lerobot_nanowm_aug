# Does NanoWM stay faithful in the OOD top-wall band, and does injected noise break it?
# (eval/wm_fidelity_ood.py -- multi-stage: pass `stage` on the CLI)
extends: nanowm_pusht_common.yaml

ckpt_key: base
seed: 300000                   # seed_namespace.wm_fidelity_ood
region: topband
n_starts: 48
inject: false
noise_sigma: 0.0               # px/step; NanoWM's own training-action std is ~20.8 px/step
noise_hold: 1
rand_hold: 1
mode: tf                       # tf (teacher forcing) | free
tf_rounds: 8
work: examples/nanowm_pusht_aug/cl/wmfid/topband
video: true
n_video_starts: 4
