# CUPID bidirectional test on ONE oracle-verified successful pool (verified464), at ONE dose:
# every arm is real + k pool pairs, fine-tuned from the base policy. LOO scores with a model that
# trained on the pool, AOI with one that never saw it; only WHICH k pairs differ between arms.
# Pipeline: examples/nanowm_pusht_aug/scripts/run_cupid_bidir.sh <this file>
extends: nanowm_pusht_common.yaml
pool_index: ~/.cache/huggingface/lerobot/local/pusht_cl_verified464/meta/pair_index.json
pool_dataset: local/pusht_cl_verified464   # every arm's k pairs are taken from here (identical build)
real_episodes: 206
drop_n_last_frames: 8
oracle_npz: null            # every pair is oracle-successful: AUROC would be undefined
rollout: {n_episodes: 200, seed: 200000, n_action_steps: 10, batch_size: 50}
grad: {param_prefixes: [rgb_encoder., unet.], num_timesteps: 256, loss_fn: square, train_crop: center,
       micro_batch: 4, allow_tf32: true, seed: 0}
sketch: {type: countsketch, proj_dim: 4000, n_sketches: 4, seed: 0}
xtx: {n_real: all, lambda_reg: 0.0, lambda_rel: 1.0e-4, seed: 0}   # same estimator both directions
score: {rollout_weight: binary, within_rollout: sum, replicates: [features, features_r1]}
select: {k: 116, random_seeds: [0, 1, 2]}
bidir:
  out_dir: outputs/cupid/bidir_verified464
  directions: {loo: configs/cupid_bidir_verified464_loo.yaml, aoi: configs/cupid_bidir_verified464_aoi.yaml}
  refs: {a_real_only: outputs/cupid/untrimmed464/eval/a_real_only, verified464: null}  # null = evaluate
