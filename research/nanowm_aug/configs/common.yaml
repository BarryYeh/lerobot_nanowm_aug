# Shared parameters for research/nanowm_aug. Every value here appeared IDENTICALLY in two or
# more scripts (see the audit table in docs/parameter_audit.md); anything that differed per
# experiment lives in that experiment's own config instead. PushT facts live in envs/pusht.yaml
# (the `extends:` line below merges them in under the same `pusht:` key).
#
# Read with nwaug/attribution/config_io.py, which resolves the `extends:` chain. From a shell recipe:
#   y() { uv run python research/nanowm_aug/nwaug/attribution/config_io.py "$CFG" "$1"; }
#   y finetune.save_freq
extends: envs/pusht.yaml

# ---- environment / hardware ----
device: cuda
nanowm_python: third_party/nano-world-model/.venv/bin/python   # nwaug/wm/closed_loop_rollout.py, nwaug/eval/wm_fidelity_ood.py
# NanoWM inputs (public, pinned):
#   code : github.com/simchowitzlabpublic/nano-world-model @ cc1f151a9d8c7d7afd0cdc5de6a9ae220a7c90c0,
#          vendored as a squashed git subtree at third_party/nano-world-model
#   ckpt : hf knightnemo/nanowm-b2-dino-wm-pusht-100k @ 613919a5 -> third_party/nano-world-model/ckpt/
#          model.safetensors sha256 2a3a48f854ea3c1a4ce844f80852da063c36c89c9181e8735faa43cc7714c60a
#   vae  : hf stabilityai/sd-vae-ft-mse @ 31f26fde -> ~/models/sd-vae-ft-mse (VAE_MODEL_PATH)
#          diffusion_pytorch_model.safetensors sha256 a1d993488569e928462932c8c38a0760b874d166399b14414135bd9c42df5815
dataset_dir: ~/Downloads/bmw48-osfstorage-datasets-archive
lerobot_home: ~/.cache/huggingface/lerobot

# ---- Hugging Face Hub (shared by every experiment) ----
# Pins and local paths for the public artifacts the pipeline downloads. Nothing here is a credential: the
# access token comes from `hf auth login` / HF_TOKEN, never from this repo. Dataset cache root is
# `lerobot_home` above (== $HF_LEROBOT_HOME). `local_dir` values are NOT expanded by config_io: `~` stays literal.
hf:
  push_to_hub: false           # every run here is local-only (finetune_cl.sh passes --policy.push_to_hub=false)
  nanowm_ckpt:                 # world-model weights, downloaded into the vendored nano-world-model tree
    repo_id: knightnemo/nanowm-b2-dino-wm-pusht-100k
    revision: 613919a5
    local_dir: third_party/nano-world-model/ckpt
    model_sha256: 2a3a48f854ea3c1a4ce844f80852da063c36c89c9181e8735faa43cc7714c60a   # model.safetensors
  vae:                         # SD-VAE the NanoWM checkpoint's config.yaml points at (env VAE_MODEL_PATH)
    repo_id: stabilityai/sd-vae-ft-mse
    revision: 31f26fde
    local_dir: ~/models/sd-vae-ft-mse
    model_sha256: a1d993488569e928462932c8c38a0760b874d166399b14414135bd9c42df5815   # diffusion_pytorch_model.safetensors

# ---- Weights & Biases account (shared by every experiment) ----
# `project` is NOT set here: each experiment yaml names its own (`wandb: {project: ...}`), merged under this block.
# Read by proj/pusht/sailor/train_value_model.py (the whole block) and, via env, by scripts/finetune_cl.sh
# (WANDB_ENTITY / WANDB_PROJECT / WANDB_MODE / WANDB_ENABLE set by the run_cupid_*.sh drivers).
wandb:
  entity: null                 # W&B user or team to log under; null = the account `wandb login` is signed in as
  mode: online                 # online | offline | disabled
  enable: true                 # master switch; WANDB_ENABLE=false (env) or --no-wandb turns it off per run

# ---- NanoWM sampling (same in closed_loop_rollout + wm_fidelity_ood) ----
nanowm:
  num_sampling_steps: 30
  wm_batch: 24
  history: 3                   # n_context_frames; the worker REFUSES fewer
  num_frames: 4                # nf, fixed by the checkpoint
  rounds: 8                    # h_max

# ---- checkpoints ----
ckpt:
  # BASE_CKPT, hardcoded identically in 3 py files + finetune_cl.sh + run_dose500.sh
  base: outputs/train/pusht_imgonly/obs1_s100000/checkpoints/last/pretrained_model
  finetuned_untrimmed464: outputs/train/cl_aug/untrimmed464_d8_s1000/checkpoints/last/pretrained_model
  control_d8: outputs/train/cl_aug/a_real_only_d8_s1000/checkpoints/last/pretrained_model

# ---- base-policy config (READONLY) ----
base_policy:
  type: diffusion
  input_features:
    observation.image: {type: VISUAL, shape: [3, 96, 96]}
  output_features:
    action: {type: ACTION, shape: [2]}
  n_obs_steps: 1
  horizon: 16
  n_action_steps: 8
  drop_n_last_frames: 8
  normalization_mapping: {VISUAL: MEAN_STD, STATE: MIN_MAX, ACTION: MIN_MAX}
  vision_backbone: resnet18
  crop_shape: [84, 84]
  crop_is_random: true
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  spatial_softmax_num_keypoints: 32
  use_separate_rgb_encoder_per_camera: true
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true
  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0
  do_mask_loss_for_padding: false

datasets:
  real: local/pusht_imgonly              # 206 episodes, the real-only arm and the stats anchor
  pool_untrimmed464: local/pusht_cl_untrimmed464
  train_untrimmed464: local/pusht_plus_untrimmed464

# ---- the eval protocol every arm must share to be comparable ----
eval:
  n_episodes: 1000
  seed: 100000                 # episode i -> seed 100000+i; pairs arms by episode order
  batch_size: 50
  n_action_steps: 10           # na8 vs na10 moves Control 64.3% -> 67.4%: never leave it implicit
  use_async_envs: false        # the async vector env crashes on startup on this box

# ---- fine-tuning from `ckpt.base` (finetune_cl.sh) ----
finetune:
  seed: 1000
  steps: 20000
  lr: 1.0e-5
  batch_size: 64
  drop_n_last_frames: 8        # MUST match the pack's --ep-len minus 1, and match across arms
  image_transforms: true
  save_freq: 20000

# ---- from-scratch training (historical hyperparams; reserved so later runs stay comparable) ----
train:
  steps: 100000
  batch_size: 64
  horizon: 16
  n_action_steps: 8
  n_obs_steps: 1
  save_freq: 20000

# ---- seed namespaces: DELIBERATELY disjoint so experiments never share initial states ----
# Reusing one of these in a new experiment silently correlates it with that experiment.
seed_namespace:
  closed_loop_leadin: 9000
  eval: 100000
  cupid_test_rollouts: 200000
  wm_fidelity_ood: 300000
  mode_probe: 400000           # reserved (script removed); do not reuse
  agent_value_map: 400000      # reserved (script removed); same namespace as mode_probe
  ood_failure_map: 500000
  cupid_topband_pool: 600000   # cupid_select_topband: pool / test / eval band starts
  cupid_topband_test: 610000
  cupid_topband_eval: 620000
  value_stage1_band: 700000    # value_model_topband stage 1: top-wall-band episode starts
  value_stage1_reset: 710000   # value_model_topband stage 1: random-reset episode starts
  value_stage2_anchor: 720000  # value_model_topband stage 2: imagined-branch anchor starts
  sailor_v1_stage1_reset: 730000   # sailor_v1_reset stage 1: random-reset episode starts (env.reset(seed=730000+i))
  sailor_v1_stage2_anchor: 740000  # sailor_v1_reset stage 2: reset rollouts that anchors are drawn FROM
  sailor_v1_test_anchor: 750000    # sailor_v1_reset G6 test anchors: independent reset rollouts, never seen in training
  sailor_v1_t2_checks: 760000      # sailor_v1 T2 simulator checks (noise vs clean success rate, failure timing)
  sailor_v1_label_cont: 770000     # sailor_v1 stage-2 continuation policy sampling (label); Table D re-run uses 770001
  sailor_expand_anchor: 780000     # sailor_expand: reset rollouts the candidate anchors are drawn FROM (+ imagine torch / noise seeds)
  sailor_expand_screen: 790000     # sailor_expand: base-policy screening rollouts from the candidate anchors
  sailor_expand_verify: 900000     # sailor_expand: discovery continuation seeds 900000 + 2i (cont_seed + 1 = noise rng)
  sailor_expand_replicate: 910000  # sailor_expand: replication continuation seeds 910000 + 2i
  imagined_replay_source: 920000  # imagined_replay collect_success.py: source episodes env.reset(seed=920000+i)
  imagined_replay_branch: 930000  # imagined_replay collect_success.py: branch torch seeds 930000 + start id
  heuristic_late_states: 940000      # heuristic collect_late_states.py: source episodes env.reset(seed=940000+i) (+1 = rng)
  heuristic_lastmile_branch: 950000  # heuristic run_lastmile.sh: closed_loop_rollout --torch-seed 950000 --noise-seed 950003
  heuristic_lastmile_select: 960000  # heuristic select_lastmile.py: numpy rng of the random (R) pick
  imagined_replay_wm: 990000      # imagined_replay replay_imagine.py: NanoWM worker --seed 990000 + 1000*part + chunk (lastmile_w_imagine.py: 990000 + 2000, an unused part)
  imagined_replay_select: 995000  # imagined_replay pack_pairs.py: numpy rng of the per-start pair selection
