[project]
name = "nano-world-model"
version = "0.1.0"
description = "Reproducible NanoWM training, sampling, and evaluation environment"
requires-python = ">=3.11,<3.12"
dependencies = [
    # One owner for the complete PyTorch/CUDA stack. cu128 supports Ampere and Blackwell.
    "torch==2.7.1",
    "torchvision==0.22.1",
    "pytorch-lightning==1.9.5",
    "torchmetrics==1.3.2",
    "setuptools==80.9.0", # Lightning 1.9 imports pkg_resources.
    "numpy==1.26.4", # decord and the legacy simulator stack use the NumPy 1 ABI.
    "diffusers==0.29.2", # Compatible with LeRobot 0.3.3 and modern huggingface-hub.
    "transformers==4.51.3",
    "huggingface-hub==0.34.4",
    "accelerate==1.7.0",
    "timm==1.0.15",
    "einops==0.8.1",
    "lpips==0.1.4",
    "piqa==1.3.2",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "wandb==0.21.1",
    "tensorboard==2.20.0",
    "eva-decord==0.6.1", # Same decord API, corrected Python wheel tags.
    "h5py>=3.11",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "Pillow>=10,<12",
    "tqdm>=4.66",
    "requests>=2.32",
    "opencv-python-headless==4.11.0.86", # A single cv2 provider; no system libGL required.
    "imageio>=2.34,<3",
    "imageio-ffmpeg==0.6.0",
    "moviepy==1.0.3",
    "scikit-image>=0.23,<0.26",
    "av==14.2.0", # Last 14.x release with Linux CPython 3.11 wheels.
    "pytorch-fid==0.3.0",
    "matplotlib>=3.9,<4",
    "seaborn==0.13.2",
    "sentencepiece>=0.2,<0.3",
    "beautifulsoup4>=4.12,<5",
    "ftfy>=6.2,<7",
    "protobuf==4.25.3",
    "safetensors>=0.4.3,<0.6",
]

[project.optional-dependencies]
rt1 = [
    "lerobot==0.3.3",
    "torchcodec==0.4.0", # TorchCodec's native ABI must match torch 2.7.
]

[dependency-groups]
dev = ["pytest==8.4.2", "pip==25.2"]

[tool.uv]
package = false
required-version = ">=0.8.0"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-build-package = ["av", "torch", "torchvision", "eva-decord"]
build-constraint-dependencies = ["setuptools==80.9.0", "wheel==0.45.1"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
